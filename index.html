<body>
<div id="root"></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.2/babel.min.js"></script>
<script type="text/babel">
const {useState,useEffect,useCallback,useRef,useMemo}=React;

// ─── Athlete & Constants ──────────────────────────────────────────────────────
const ATHLETE={ftp:220,weight:69,vo2max:55,restingHR:44,targetFtp:280};
const PLAN_START=new Date(Date.UTC(2026,9,26)); // Mon 26 Oct 2026
const DAY_NAMES=["M","T","W","T","F","S","S"];

// ─── Zones ────────────────────────────────────────────────────────────────────
const ZONES=[
  {id:1,name:"Active Recovery",pct:[0,54],color:"#64748b",bg:"#f8fafc"},
  {id:2,name:"Endurance",pct:[55,74],color:"#22c55e",bg:"#f0fdf4"},
  {id:3,name:"Tempo",pct:[75,89],color:"#f59e0b",bg:"#fffbeb"},
  {id:4,name:"Threshold",pct:[90,104],color:"#f97316",bg:"#fff7ed"},
  {id:5,name:"VO2 Max",pct:[105,120],color:"#ef4444",bg:"#fef2f2"},
];
const calcW=(pct,ftp)=>Math.round(ftp*pct/100);
const getZone=(pct)=>ZONES.find(z=>pct>=z.pct[0]&&pct<=z.pct[1])||ZONES[4];
const midPct=(iv)=>iv.ramp?((iv.ramp[0]+iv.ramp[1])/2):iv.pct;
const ivLabel=(iv,ftp)=>iv.ramp?`${calcW(iv.ramp[0],ftp)}–${calcW(iv.ramp[1],ftp)}w`:iv.pct?`${calcW(iv.pct,ftp)}w`:"";

// ─── Session Types ────────────────────────────────────────────────────────────
const SESSION_TYPES={
  Z2:     {label:"Zone 2",color:"#22c55e",bg:"#f0fdf4"},
  STRENGTH:{label:"Strength",color:"#8b5cf6",bg:"#f5f3ff"},
  RECOVERY:{label:"Recovery",color:"#64748b",bg:"#f8fafc"},
  REST:   {label:"Rest",color:"#94a3b8",bg:"#f8fafc"},
  FREE:   {label:"Free ride",color:"#6366f1",bg:"#eef2ff"},
  HOLIDAY:{label:"Holiday",color:"#0ea5e9",bg:"#f0f9ff"},
  SICK:   {label:"Sick",color:"#be185d",bg:"#fdf2f8"},
  TEST:   {label:"Test",color:"#7c3aed",bg:"#faf5ff"},
};

// ─── State helpers ────────────────────────────────────────────────────────────
const _mem={};
function loadState(k,fb){try{const v=localStorage.getItem(k);return v!==null?JSON.parse(v):fb;}catch{return _mem[k]!==undefined?_mem[k]:fb;}}
function saveState(k,v){try{localStorage.setItem(k,JSON.stringify(v));}catch{_mem[k]=v;}}

// ─── Date helpers ─────────────────────────────────────────────────────────────
function getPlanDate(idx){const d=new Date(PLAN_START);d.setDate(d.getDate()+idx);return d;}
function fmtDate(d){return d.toLocaleDateString("en-GB",{weekday:"short",day:"numeric",month:"short"});}
function getTodayIndex(){
  const now=new Date();
  const utcNow=Date.UTC(now.getFullYear(),now.getMonth(),now.getDate());
  const diff=Math.round((utcNow-PLAN_START.getTime())/86400000);
  return Math.max(0,Math.min(83,diff));
}

// ─── Zone 2 Variants ──────────────────────────────────────────────────────────
const Z2_VARIANTS={
  Z2_STEADY_60:{
    id:"Z2_STEADY_60",name:"Zone 2 — Steady 60",type:"Z2",duration:60,tss:52,
    description:"Steady aerobic foundation. Power stays solidly in Zone 2 throughout. Focus on nasal breathing — if you need to open your mouth, ease off. Cadence 85–95rpm.",
    intervals:[{label:"Warm-up",ramp:[30,65],dur:10},{label:"Zone 2 steady",pct:65,dur:45},{label:"Cool-down",ramp:[65,40],dur:5}]
  },
  Z2_CADENCE_60:{
    id:"Z2_CADENCE_60",name:"Zone 2 — Cadence 60",type:"Z2",duration:60,tss:52,
    description:"Zone 2 with cadence focus. Alternate between 95–100rpm and 75–80rpm every 10 minutes. Same power band — cadence work without raising intensity.",
    intervals:[{label:"Warm-up",ramp:[30,65],dur:10},{label:"High cadence 95–100rpm",pct:63,dur:10},{label:"Low cadence 75–80rpm",pct:67,dur:10},{label:"High cadence",pct:63,dur:10},{label:"Low cadence",pct:67,dur:10},{label:"Cool-down",ramp:[65,40],dur:10}]
  },
  Z2_PROGRESSIVE_60:{
    id:"Z2_PROGRESSIVE_60",name:"Zone 2 — Progressive 60",type:"Z2",duration:60,tss:54,
    description:"Start at the bottom of Zone 2 and drift toward the top over 45 minutes. Tests your ability to stay aerobic as fatigue builds. Cool down easy.",
    intervals:[{label:"Warm-up",ramp:[30,60],dur:10},{label:"Zone 2 build",ramp:[60,72],dur:45},{label:"Cool-down",ramp:[65,40],dur:5}]
  },
  Z2_TEMPO_BURSTS_60:{
    id:"Z2_TEMPO_BURSTS_60",name:"Zone 2 — Tempo Bursts 60",type:"Z2",duration:60,tss:58,
    description:"Mostly Zone 2 with three short Tempo bursts to stimulate type IIa fibres. Bursts are aerobic, not lactate — don't push into threshold.",
    intervals:[{label:"Warm-up",ramp:[30,65],dur:10},{label:"Zone 2",pct:65,dur:10},{label:"Tempo burst",pct:80,dur:5},{label:"Zone 2",pct:65,dur:10},{label:"Tempo burst",pct:80,dur:5},{label:"Zone 2",pct:65,dur:10},{label:"Cool-down",ramp:[65,40],dur:10}]
  },
  Z2_STEADY_90:{
    id:"Z2_STEADY_90",name:"Zone 2 — Steady 90",type:"Z2",duration:90,tss:75,
    description:"Long aerobic block. This is the cornerstone of base building — extended duration drives mitochondrial adaptation. Keep it genuinely easy. 90–95rpm target.",

  Z2_PYRAMID_90:{
    id:"Z2_PYRAMID_90",name:"Zone 2 — Pyramid 90",type:"Z2",duration:90,tss:78,

    intervals:[{label:"Warm-up",ramp:[30,60],dur:15},{label:"Low Z2",pct:60,dur:15},{label:"Mid Z2",pct:65,dur:15},{label:"Upper Z2",pct:72,dur:20},{label:"Mid Z2",pct:65,dur:15},{label:"Cool-down",ramp:[63,40],dur:10}]
  },
};
const Z2_60_IDS=["Z2_STEADY_60","Z2_CADENCE_60","Z2_PROGRESSIVE_60","Z2_TEMPO_BURSTS_60"];
const Z2_90_IDS=["Z2_STEADY_90","Z2_PYRAMID_90"];

// ─── Strength Sessions — 12-week progressive programme ────────────────────────
// Mon & Thu, cycling-specific, beginner, RPE-based, up to 60 min
const STRENGTH_SESSIONS={
  // Weeks 1–3: Foundation — movement patterns, bodyweight focus
  STR_FOUNDATION:{
    id:"STR_FOUNDATION",name:"Strength — Foundation",type:"STRENGTH",duration:45,tss:25,
    description:"Learn the movement patterns. Light load or bodyweight only. Focus entirely on form — these are the same movements you'll load progressively over 12 weeks.",
    phase:"Foundation",weeks:"1–3",
    exercises:[
      {name:"Goblet squat",sets:"3×10",rpe:"RPE 4–5",cue:"Chest tall, knees track over toes, hips below parallel. Pause 2 sec at bottom.",video:"https://www.youtube.com/watch?v=MxsFDiCl-3Y"},
      {name:"Single-leg Romanian deadlift",sets:"3×8/leg",rpe:"RPE 4–5",cue:"Hinge from the hip, flat back. Opposite leg trails back. Feel hamstring tension before returning.",video:"https://www.youtube.com/watch?v=2cCg7Pk1DYs"},
      {name:"Hip bridge",sets:"3×12",rpe:"RPE 4",cue:"Drive through heels, squeeze glutes at top. 2-sec hold. Pelvis neutral — no arching the back.",video:"https://www.youtube.com/watch?v=OUgsJ8-Vi0E"},
      {name:"Side-lying clamshell",sets:"3×15/side",rpe:"RPE 4",cue:"Feet together, rotate top knee up without rolling the pelvis. Fires glute med — critical for pedalling stability.",video:"https://www.youtube.com/watch?v=SJ1Xuz9D-ZQ"},
      {name:"Dead bug",sets:"3×8/side",rpe:"RPE 4",cue:"Lower back pressed to floor throughout. Slow extension of opposite arm/leg. Stop if you feel your back lift.",video:"https://www.youtube.com/watch?v=g_BYB0R-4Ws"},
      {name:"Plank",sets:"3×30s",rpe:"RPE 4",cue:"Straight line from ears to ankles. Don't let hips sag or pike. Breathe normally.",video:"https://www.youtube.com/watch?v=pSHjTRCQxIw"},
    ]
  },
  // Weeks 4–6: Load introduction — add weight, single-leg emphasis
  STR_LOAD:{
    id:"STR_LOAD",name:"Strength — Load Introduction",type:"STRENGTH",duration:50,tss:30,
    description:"Add load to the patterns you've built. Single-leg work is the priority — cycling is entirely single-leg. Use a weight where form holds for every rep.",
    phase:"Load",weeks:"4–6",
    exercises:[
      {name:"Dumbbell split squat",sets:"4×8/leg",rpe:"RPE 6–7",cue:"Back knee drops straight down. Front shin vertical. Torso upright. Pause at bottom — no momentum.",video:"https://www.youtube.com/watch?v=e8RxfTnFqQs"},
      {name:"Single-leg Romanian deadlift",sets:"4×8/leg",rpe:"RPE 6–7",cue:"Add load but keep movement quality. You should feel it in the hamstring, not the back.",video:"https://www.youtube.com/watch?v=2cCg7Pk1DYs"},
      {name:"Hip thrust",sets:"4×10",rpe:"RPE 6",cue:"Upper back on bench, bar across hips. Full hip extension — squeeze hard at top. 1-sec hold.",video:"https://www.youtube.com/watch?v=SEdqd1n0cvg"},
      {name:"Copenhagen plank",sets:"3×20s/side",rpe:"RPE 5–6",cue:"Top foot on bench, bottom leg lifted. Straight line. Works adductors — key for lateral stability on the bike.",video:"https://www.youtube.com/watch?v=FhLpE5gQOuk"},
      {name:"Pallof press",sets:"3×10/side",rpe:"RPE 5",cue:"Press hands straight out, hold 2s, return. Resist rotation — core anti-rotation is more cycling-relevant than sit-ups.",video:"https://www.youtube.com/watch?v=AH_QZLm_0-s"},
      {name:"Dumbbell row",sets:"3×10/arm",rpe:"RPE 6",cue:"Chest supported or knee on bench. Row to hip, not armpit. Keeps upper back strong for long rides.",video:"https://www.youtube.com/watch?v=GZbfZ033f74"},
    ]
  },
  // Weeks 7–9: Progressive overload — heavier, add Bulgarian split squat
  STR_PROGRESSIVE:{
    id:"STR_PROGRESSIVE",name:"Strength — Progressive Overload",type:"STRENGTH",duration:55,tss:35,
    description:"Heavier weights, more single-leg volume. Bulgarian split squat replaces the standard split squat — greater range of motion and more glute/quad recruitment.",
    phase:"Progressive",weeks:"7–9",
    exercises:[
      {name:"Bulgarian split squat",sets:"4×8/leg",rpe:"RPE 7–8",cue:"Rear foot elevated, drop into deep single-leg squat. Lean slightly forward from the hip. One of the best cycling-strength exercises there is.",video:"https://www.youtube.com/watch?v=2C-uNgKwPLE"},
      {name:"Romanian deadlift",sets:"4×8",rpe:"RPE 7",cue:"Both legs now. Push hips back, flat back, loaded stretch in hamstrings. Return by driving hips forward — not pulling with your back.",video:"https://www.youtube.com/watch?v=hCDzSR6bW10"},
      {name:"Step-up with knee drive",sets:"3×10/leg",rpe:"RPE 6–7",cue:"Drive through the heel of the working leg. At the top, bring opposite knee to 90°. Controlled lowering.",video:"https://www.youtube.com/watch?v=WCFCdxzFBa4"},
      {name:"Hip thrust",sets:"4×8",rpe:"RPE 7–8",cue:"Increase load further. Focus on full hip extension and glute contraction. This is power generation — same as the pedal stroke.",video:"https://www.youtube.com/watch?v=SEdqd1n0cvg"},
      {name:"Side plank with hip abduction",sets:"3×10/side",rpe:"RPE 6",cue:"Side plank position, top leg lifts slowly. Works glute med under load. Key for knee tracking while fatigued.",video:"https://www.youtube.com/watch?v=_6vzo4NVuLk"},
      {name:"Face pull / Band pull-apart",sets:"3×15",rpe:"RPE 5",cue:"Pull to face, elbows high and wide. Keeps rotator cuff and upper back balanced against the forward-hunched riding position.",video:"https://www.youtube.com/watch?v=rep-qVOkqgk"},
    ]
  },
  // Weeks 10–12: Peak strength — heaviest loads, maintain form
  STR_PEAK:{
    id:"STR_PEAK",name:"Strength — Peak",type:"STRENGTH",duration:60,tss:40,
    description:"Maximum strength phase. These loads feed directly into peak power output on the bike. Every rep must be technically perfect — stop a set early if form breaks down.",
    phase:"Peak",weeks:"10–12",
    exercises:[
      {name:"Bulgarian split squat",sets:"5×6/leg",rpe:"RPE 8",cue:"Heaviest weight yet. Take 2–3 min rest between legs. This drives the most adaptation — it's worth the effort.",video:"https://www.youtube.com/watch?v=2C-uNgKwPLE"},
      {name:"Romanian deadlift",sets:"4×6",rpe:"RPE 8",cue:"Slow eccentric — 3 seconds down, explosive up. Engages the stretch reflex. Think about it as loading a spring.",video:"https://www.youtube.com/watch?v=hCDzSR6bW10"},
      {name:"Single-leg press (or pistol squat regression)",sets:"4×8/leg",rpe:"RPE 7",cue:"If no leg press machine, do box pistol squats (lower to box, stand single-leg). Full range, controlled.",video:"https://www.youtube.com/watch?v=U9CiGNfGxws"},
      {name:"Hip thrust",sets:"4×6",rpe:"RPE 8",cue:"Heaviest hip thrust of the plan. Drive hips through full range, explosive concentric, slow eccentric.",video:"https://www.youtube.com/watch?v=SEdqd1n0cvg"},
      {name:"Dumbbell lateral lunge",sets:"3×8/side",rpe:"RPE 6–7",cue:"Step wide, sit back and down into working leg. Other leg straight. Excellent for hip stability and single-leg strength.",video:"https://www.youtube.com/watch?v=IFznA6NXQKY"},
      {name:"Copenhagen plank",sets:"4×25s/side",rpe:"RPE 6–7",cue:"Progress from wks 4–6. Longer holds, better bracing. Core strength at fatigue is what matters on long climbs.",video:"https://www.youtube.com/watch?v=FhLpE5gQOuk"},
    ]
  },
};

// Determine which strength session by week number
function getStrengthSession(weekNum){
  if(weekNum<=3) return STRENGTH_SESSIONS.STR_FOUNDATION;
  if(weekNum<=6) return STRENGTH_SESSIONS.STR_LOAD;
  if(weekNum<=9) return STRENGTH_SESSIONS.STR_PROGRESSIVE;
  return STRENGTH_SESSIONS.STR_PEAK;
}

// ─── Cycling Workouts ─────────────────────────────────────────────────────────
// Merge strength sessions into WORKOUTS lookup so they resolve correctly
const STRENGTH_WORKOUT_MAP=Object.fromEntries(
  Object.values(STRENGTH_SESSIONS).map(s=>[s.id,s])
);

const WORKOUTS={
  ...Z2_VARIANTS,
  ...STRENGTH_WORKOUT_MAP,
  RECOVERY:{
    id:"RECOVERY",name:"Active Recovery",type:"RECOVERY",duration:30,tss:12,
    description:"20–30 min very easy spin. Zone 1 only — below 55% FTP. No structure, no targets. Just move the legs. This accelerates recovery, not fitness.",
    intervals:[{label:"Easy spin",ramp:[30,50],dur:30}]
  },
  REST:{id:"REST",name:"Rest",type:"REST",duration:0,tss:0,description:"Complete rest day. Sleep, eat, recover.",intervals:[]},
  FREE:{id:"FREE",name:"Free ride",type:"FREE",duration:90,tss:60,description:"No structure. Ride wherever you like.",intervals:[]},
  FTP_TEST:{
    id:"FTP_TEST",name:"FTP Test — 20-min",type:"TEST",duration:70,tss:85,
    description:"Standard 20-minute FTP test. 95% of your 20-min average power = new FTP. Warm up thoroughly — the test result depends on it. Take the day before completely off the bike.",
    intervals:[
      {label:"Warm-up — easy",pct:55,dur:10},
      {label:"3×1min fast legs (1min rest)",pct:110,dur:5},
      {label:"5min easy",pct:55,dur:5},
      {label:"5min hard — establish ceiling",pct:105,dur:5},
      {label:"10min easy",pct:55,dur:10},
      {label:"20-MINUTE TEST — all out",pct:100,dur:20},
      {label:"Cool-down",ramp:[65,40],dur:15},
    ]
  },
};

// ─── Base Plan — 12-week Zone 2 + Strength, no VO2/threshold/peak ────────────
// Structure per week:
// Mon: Z2 60 | Tue: Strength | Wed: Z2 90 | Thu: Strength | Fri: Z2 60 | Sat: Free (outdoor) | Sun: Rest
// Recovery weeks (4 & 8): volume -30%, no 90-min sessions
// Week 12: FTP test midweek, taper around it

const buildPlan=(overrides={})=>{
  const plan=[];
  const z2_60=Z2_60_IDS;
  const z2_90=Z2_90_IDS;
  let z60i=0, z90i=0;

  for(let wk=0;wk<12;wk++){
    const weekNum=wk+1;
    const isRecovery=weekNum===4||weekNum===8;
    const isTestWeek=weekNum===12;
    const strSession=getStrengthSession(weekNum);

    // Days: 0=Mon 1=Tue 2=Wed 3=Thu 4=Fri 5=Sat 6=Sun
    const week=[
      isRecovery ? "RECOVERY" : z2_60[z60i%4],                  // Mon: Z2 60 (recovery spin in recovery week)
      isTestWeek ? "Z2_STEADY_60" : strSession.id,               // Tue: Strength (or easy Z2 in test week)
      isTestWeek ? "FTP_TEST" : (isRecovery ? "Z2_STEADY_60" : z2_90[z90i%2]), // Wed: Z2 90 (FTP test in week 12, Z2 60 in recovery)
      isTestWeek ? "RECOVERY" : (isRecovery ? "RECOVERY" : strSession.id), // Thu: Strength (recovery in recovery/test weeks)
      isRecovery ? "RECOVERY" : z2_60[(z60i+2)%4],              // Fri: Z2 60 (recovery in recovery week)
      "FREE",                                                     // Sat: Free outdoor ride
      "REST",                                                     // Sun: Rest
    ];

    // Increment rotation counters
    if(!isRecovery&&!isTestWeek){ z60i++; z90i++; }

    for(let d=0;d<7;d++){
      const idx=wk*7+d;
      const ov=overrides[idx];
      plan.push({workoutId:ov||week[d], weekNum, dayOfWeek:d});
    }
  }
  return plan;
};

// ─── Readiness adjustment ─────────────────────────────────────────────────────
function adjustForReadiness(wId,readiness,restingHR,legsScore,tsb){
  const hrPenalty=Math.max(0,(restingHR-ATHLETE.restingHR)*2);
  const safe=legsScore>=1&&legsScore<=5?legsScore:3;
  const legsPenalty=Math.max(0,(3-safe)*5);
  const tsbPenalty=(tsb===null||tsb===undefined)?0
    :(readiness>=70&&tsb<-20)?15
    :(readiness>=60&&tsb<-30)?20
    :(readiness<50&&tsb>10)?-5:0;
  const eff=Math.max(0,readiness-hrPenalty-legsPenalty+tsbPenalty);

  const w=WORKOUTS[wId];
  const isZ2=w&&w.type==="Z2";
  const isStr=w&&w.type==="STRENGTH";

  // REST and FREE days are never overridden by readiness
  if(wId==="REST"||wId==="FREE") return {id:wId,note:null,adjusted:false,eff,strMod:null};

  if(eff>=80) return {id:wId,note:null,adjusted:false,eff,strMod:null};
  if(eff>=65){
    if(isZ2){
      const lighter=Z2_60_IDS[0];
      const changed=wId.includes("90")||wId.includes("PYRAMID");
      return {id:changed?lighter:wId,note:changed?"Readiness slightly reduced — switching to 60-min Z2.":null,adjusted:changed,eff,strMod:null};
    }
    if(isStr) return {id:wId,note:"Readiness slightly reduced — take extra rest between sets and drop RPE by 1 if needed.",adjusted:false,eff,strMod:"easy"};
    return {id:wId,note:null,adjusted:false,eff,strMod:null};
  }
  if(eff>=50){
    if(isStr) return {id:wId,note:"Moderate readiness — keep the session but drop to 2–3 sets per exercise and reduce RPE by 1–2. Skip any exercise that feels wrong today.",adjusted:false,eff,strMod:"reduced"};
    if(isZ2){
      const lighter=Z2_60_IDS[0];
      return {id:lighter,note:"Moderate readiness — keeping it to 60 min Zone 2.",adjusted:wId!==lighter,eff,strMod:null};
    }
    return {id:"Z2_STEADY_60",note:"Stepped down to Zone 2 today.",adjusted:true,eff,strMod:null};
  }
  if(eff>=35){
    if(isStr) return {id:wId,note:"Low readiness — do the warm-up only (2 sets of each) and call it done. Movement without stress.",adjusted:false,eff,strMod:"warmup"};
    return {id:"RECOVERY",note:"Low readiness — easy spin only today. Zone 1, no targets.",adjusted:wId!=="RECOVERY",eff,strMod:null};
  }
  if(isStr) return {id:"REST",note:"Readiness is very low — skip the gym today. The session will still be here next week.",adjusted:true,eff,strMod:null};
  return {id:"REST",note:"Readiness is very low — take a full rest day. The plan will still be here tomorrow.",adjusted:wId!=="REST",eff,strMod:null};
}

// ─── ZWO export ───────────────────────────────────────────────────────────────
function generateZWO(wId,ftp,zwiftName,workoutOverride){
  const w=workoutOverride||WORKOUTS[wId];
  if(!w||!w.intervals||w.intervals.length===0) return null;
  const esc=s=>s.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
  let xml=`<?xml version="1.0" encoding="utf-8"?>\n<workout_file>\n`;
  xml+=`  <author>WykesWatts Coach</author>\n`;
  xml+=`  <name>${esc(zwiftName)}</name>\n`;
  xml+=`  <description>${esc(w.description||"")}</description>\n`;
  xml+=`  <sportType>bike</sportType>\n  <tags/>\n  <workout>\n`;
  for(const iv of w.intervals){
    const sec=iv.dur*60;
    if(iv.ramp){
      const lo=(iv.ramp[0]/100).toFixed(3);
      const hi=(iv.ramp[1]/100).toFixed(3);
      const [lo2,hi2]=iv.ramp[0]<iv.ramp[1]?[lo,hi]:[hi,lo];
      const tag=iv.ramp[0]<iv.ramp[1]?"Warmup":"Cooldown";
      xml+=`    <${tag} Duration="${sec}" PowerLow="${lo2}" PowerHigh="${hi2}" pace="0"/>\n`;
    } else {
      const p=(iv.pct/100).toFixed(3);
      xml+=`    <SteadyState Duration="${sec}" Power="${p}" pace="0"/>\n`;
    }
  }
  xml+=`  </workout>\n</workout_file>`;
  return xml;
}
function downloadZWO(wId,ftp,wName,weekNum,planDayIdx,workoutOverride){
  const day=planDayIdx%7;
  const dayNames=["Mon","Tue","Wed","Thu","Fri","Sat","Sun"];
  const safeName=wName.replace(/[^a-zA-Z0-9\s–\-]/g,"").replace(/\s+/g,"_").substring(0,40);
  const filename=`Claude_W${String(weekNum).padStart(2,"0")}_${dayNames[day]}_${safeName}.zwo`;
  const zwiftTitle=`Claude_W${String(weekNum).padStart(2,"0")}_${dayNames[day]}_${safeName}`;
  const xml=generateZWO(wId,ftp,zwiftTitle,workoutOverride);
  if(!xml) return;
  const blob=new Blob([xml],{type:"application/xml"});
  const url=URL.createObjectURL(blob);
  const a=document.createElement("a");
  a.href=url; a.download=filename; a.click();
  URL.revokeObjectURL(url);
}
function shortenWorkout(w,pct){
  if(!pct||pct>=1) return w;
  const scaled=w.intervals.map(iv=>({...iv,dur:Math.max(1,Math.round(iv.dur*pct))}));
  const dur=scaled.reduce((s,iv)=>s+iv.dur,0);
  const tss=Math.round(w.tss*pct);
  return {...w,intervals:scaled,duration:dur,tss,tssDeficit:w.tss-tss};
}

  if(!data) return <div style={{fontSize:13,color:"var(--text-muted)",padding:"12px 0"}}>No data yet — will check automatically.</div>;

        <div style={{fontSize:13,color:"var(--text-muted)"}}>

          {planned&&<span style={{color:"var(--text-secondary)"}}> Planned: <strong>{planned.name}</strong> — skipped or rest taken.</span>}
        </div>
      </div>
    );
  }
  const ride=data.ride;
  const planned=WORKOUTS[plannedId];
  let assessment=null,assessColor="#16a34a",assessIcon="✅";
  if(planned&&planned.type!=="FREE"&&planned.type!=="REST"&&planned.type!=="RECOVERY"){
    if(!ride.likelyStructured&&planned.intervals&&planned.intervals.length>0){
      assessment=`Free ride instead of ${planned.name}. TSS: ${ride.tss} (planned ~${planned.tss}).`;
      assessColor="#ca8a04"; assessIcon="🔄";
    } else if(ride.hrAssessment==="elevated"){
      assessment="HR was elevated for the power output — possible residual fatigue. Factor into today's readiness.";
      assessColor="#ea580c"; assessIcon="⚠️";
    } else if(ride.powerZoneId<=2){
      assessment="Zone 2 well executed. Power in the right range, HR appropriate.";
    } else {
      assessment=`${ride.powerZoneId>3?"Higher":"Lower"} intensity than planned (${planned.name}). Adjust readiness if needed.`;
      assessColor="#ca8a04"; assessIcon="🔄";
    }
  } else {
    assessment=ride.isVirtual?"Zwift session — structured indoor ride.":`Outdoor ride — ${ride.distance}km, ${ride.elevGain}m climbing.`;
    assessIcon="🚴";
  }
  return(
    <div>
      <div style={{display:"grid",gridTemplateColumns:"repeat(3,1fr)",gap:6,marginBottom:10}}>
        {[{label:"Duration",value:`${ride.duration}min`},{label:"Avg power",value:ride.avgPower?`${ride.avgPower}w`:"–"},{label:"Avg HR",value:ride.avgHR?`${Math.round(ride.avgHR)}bpm`:"–"},{label:"TSS",value:`${ride.tss}`},{label:"Distance",value:`${ride.distance}km`},{label:"Zone",value:ride.powerZone||"–"}].map(({label,value})=>(

      {assessment&&(
        <div style={{padding:"8px 12px",background:assessColor+"12",border:`1px solid ${assessColor}30`,borderRadius:8,fontSize:13,color:assessColor}}>
          {assessIcon} {assessment}
        </div>
      )}
    </div>
  );
}

// ─── PIN Lock ─────────────────────────────────────────────────────────────────
const PIN_CODE="3009";
function PinLock({onUnlock}){
  const [val,setVal]=useState("");
  const [err,setErr]=useState(false);
  const shake=()=>{setErr(true);setTimeout(()=>{setErr(false);setVal("");},600);};
  const check=(v)=>{
    if(v.length<4)return;
    if(v===PIN_CODE){onUnlock();}else{shake();}
  };
  const press=(d)=>{
    const next=val+d;
    setVal(next);
    if(next.length===4) check(next);
  };
  const del=()=>setVal(v=>v.slice(0,-1));
  return(
    <div style={{position:"fixed",inset:0,background:"#0f172a",display:"flex",flexDirection:"column",alignItems:"center",justifyContent:"center",zIndex:9999,userSelect:"none"}}>
      <div style={{marginBottom:28,textAlign:"center"}}>
        <div style={{fontSize:13,fontWeight:700,color:"#475569",letterSpacing:2,marginBottom:8}}>WYKESWATTS</div>
        <div style={{fontSize:22,fontWeight:800,color:"#f8fafc"}}>Enter PIN</div>
      </div>
      <div style={{display:"flex",gap:14,marginBottom:32,transition:err?"transform .05s":"none",transform:err?"translateX(8px)":"none"}}>
        {[0,1,2,3].map(i=>(
          <div key={i} style={{width:16,height:16,borderRadius:"50%",background:val.length>i?"#3b82f6":"#1e293b",border:"2px solid",borderColor:val.length>i?"#3b82f6":"#334155",transition:"background .1s"}}/>
        ))}
      </div>
      <div style={{display:"grid",gridTemplateColumns:"repeat(3,80px)",gap:10}}>
        {[1,2,3,4,5,6,7,8,9,"",0,"⌫"].map((d,i)=>(
          <button key={i} onClick={()=>d==="⌫"?del():d!==""&&press(String(d))}
            disabled={d===""}
            style={{height:80,borderRadius:16,border:"1px solid #1e293b",background:d===""?"transparent":"#1e293b",color:d==="⌫"?"#64748b":"#f8fafc",fontSize:d==="⌫"?20:26,fontWeight:600,cursor:d===""?"default":"pointer",fontFamily:"inherit",transition:"background .1s",outline:"none"}}
            onMouseDown={e=>{if(d!=="")e.currentTarget.style.background="#334155"}}
            onMouseUp={e=>{if(d!=="")e.currentTarget.style.background="#1e293b"}}
            onTouchStart={e=>{if(d!=="")e.currentTarget.style.background="#334155"}}
            onTouchEnd={e=>{if(d!=="")e.currentTarget.style.background="#1e293b"}}
          >{d}</button>
        ))}
      </div>
      {err&&<div style={{marginTop:24,fontSize:13,color:"#ef4444",fontWeight:600}}>Incorrect PIN</div>}
    </div>
  );
}

// ─── Main App ─────────────────────────────────────────────────────────────────
function App(){
  // PIN gate — only once per browser session
  const [pinUnlocked,setPinUnlocked]=useState(()=>{
    try{return sessionStorage.getItem("ww_pin")==="ok";}catch{return false;}
  });
  const handlePinUnlock=()=>{
    try{sessionStorage.setItem("ww_pin","ok");}catch{}
    setPinUnlocked(true);
  };

  const todayIdx=getTodayIndex();

  const [ftp,setFtp]=useState(()=>loadState("ww_ftp",ATHLETE.ftp));
  const [readiness,setReadiness]=useState(()=>loadState("ww_readiness",75));
  const [restingHR,setRestingHR]=useState(()=>loadState("ww_rhr",ATHLETE.restingHR));
  const [legsScore,setLegsScore]=useState(()=>{const v=loadState("ww_legs",3);return(v>=1&&v<=5)?v:3;});
  const [stravaTokens,setStravaTokens]=useState(()=>loadState("ww_strava_tokens",null));
  const [yesterdayData,setYesterdayData]=useState(()=>loadState("ww_yesterday",null));
  const [stravaData,setStravaData]=useState(()=>loadState("ww_strava_data",null));
  const [yesterdayLoading,setYesterdayLoading]=useState(false);
  const [stravaSyncing,setStravaSyncing]=useState(false);
  const [stravaError,setStravaError]=useState(null);
  const [showInstall,setShowInstall]=useState(()=>!loadState("ww_install_dismissed",false));
  const [isStandalone]=useState(()=>window.matchMedia("(display-mode: standalone)").matches||window.navigator.standalone===true);
  const [checkinDone,setCheckinDone]=useState(()=>{
    const saved=loadState("ww_checkin_date","");
    return saved===new Date().toDateString();
  });
  const [tab,setTab]=useState("checkin");
  const [currentDay,setCurrentDay]=useState(todayIdx); // starts on today
  const [overrides,setOverrides]=useState(()=>loadState("ww_overrides",{}));
  const [blockMode,setBlockMode]=useState(null);
  const [blockStart,setBlockStart]=useState(null);
  const [shortenPct,setShortenPct]=useState(null);
  const [strShortenPct,setStrShortenPct]=useState(null);
  const [dragFrom,setDragFrom]=useState(null); // day index being dragged
  const [garminData,setGarminData]=useState(()=>loadState("ww_garmin_morning",null));
  const [garminLoading,setGarminLoading]=useState(false);
  const [garminError,setGarminError]=useState(null);

  // Persist
  useEffect(()=>saveState("ww_ftp",ftp),[ftp]);
  useEffect(()=>saveState("ww_overrides",overrides),[overrides]);
  useEffect(()=>saveState("ww_readiness",readiness),[readiness]);
  useEffect(()=>saveState("ww_rhr",restingHR),[restingHR]);
  useEffect(()=>saveState("ww_legs",legsScore),[legsScore]);

  // Reset shorten when navigating days
  useEffect(()=>{setShortenPct(null);setStrShortenPct(null);},[currentDay]);

  // Auto-fetch yesterday on load
  useEffect(()=>{
    if(stravaTokens&&!yesterdayData&&!yesterdayLoading) fetchYesterday(stravaTokens);
  },[stravaTokens]);

  // Auto-fetch Garmin morning data once per day
  useEffect(()=>{
    const lastFetch=loadState("ww_garmin_date","");
    if(lastFetch!==new Date().toDateString()) fetchGarminMorning();
  },[]);

  // Handle Strava OAuth callback
  useEffect(()=>{
    const params=new URLSearchParams(window.location.search);
    const tokenParam=params.get("strava_token");
    const errorParam=params.get("strava_error");
    if(errorParam){setStravaError("Strava connection failed");window.history.replaceState({},"",window.location.pathname);}
    if(tokenParam&&!stravaTokens){
      try{
        const data=JSON.parse(decodeURIComponent(tokenParam));
        if(data.access_token){
          setStravaTokens(data);saveState("ww_strava_tokens",data);
          window.history.replaceState({},"",window.location.pathname);
          setTab("checkin");doStravaSync(data);
        }
      }catch{setStravaError("Connection failed");window.history.replaceState({},"",window.location.pathname);}
    }
  },[]);

  const fetchYesterday=async(tokens)=>{
    const t=tokens||stravaTokens;if(!t)return;
    setYesterdayLoading(true);
    try{
      const res=await fetch("/.netlify/functions/strava-yesterday",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({...t,ftp})});
      const data=await res.json();
      if(!data.error){
        setYesterdayData(data);saveState("ww_yesterday",data);
        if(data.access_token&&data.access_token!==t.access_token){
          const nt={...t,access_token:data.access_token,refresh_token:data.refresh_token,expires_at:data.expires_at};
          setStravaTokens(nt);saveState("ww_strava_tokens",nt);
        }
      }
    }catch{}
    setYesterdayLoading(false);
  };

  const fetchGarminMorning=async()=>{
    setGarminLoading(true);setGarminError(null);
    try{
      const res=await fetch("/.netlify/functions/garmin-morning");
      const data=await res.json();
      if(data.error)throw new Error(data.error);
      setGarminData(data);
      saveState("ww_garmin_morning",data);
      saveState("ww_garmin_date",new Date().toDateString());
      if(data.restingHR&&data.restingHR>30&&data.restingHR<120) setRestingHR(data.restingHR);
    }catch(err){setGarminError(err.message||"Garmin fetch failed");}
    setGarminLoading(false);
  };

  const syncAll=async()=>{
    // Fire Garmin and Strava in parallel
    await Promise.all([
      fetchGarminMorning(),
      stravaTokens?Promise.all([doStravaSync(stravaTokens),fetchYesterday(stravaTokens)]):Promise.resolve(),
    ]);
  };
  const syncing=garminLoading||stravaSyncing||yesterdayLoading;

  const doStravaSync=async(tokens)=>{
    const t=tokens||stravaTokens;if(!t)return;
    setStravaSyncing(true);setStravaError(null);
    try{
      const res=await fetch("/.netlify/functions/strava-sync",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(t)});
      const data=await res.json();
      if(data.error)throw new Error(data.error);
      if(data.access_token!==t.access_token){
        const nt={...t,access_token:data.access_token,refresh_token:data.refresh_token,expires_at:data.expires_at};
        setStravaTokens(nt);saveState("ww_strava_tokens",nt);
      }
      setStravaData(data);saveState("ww_strava_data",data);saveState("ww_strava_sync_date",new Date().toDateString());
    }catch(err){setStravaError(err.message||"Sync failed");}
    setStravaSyncing(false);
  };

  const handleStravaConnect=()=>{
    const clientId="282863";
    const redirect=encodeURIComponent(window.location.origin+"/callback");
    const scope="read,activity:read";
    window.location.href=`https://www.strava.com/oauth/authorize?client_id=${clientId}&redirect_uri=${redirect}&response_type=code&scope=${scope}`;
  };

  const handleCheckinSave=()=>{
    const today=new Date().toDateString();
    saveState("ww_checkin_date",today);
    saveState("ww_readiness",readiness);
    saveState("ww_rhr",restingHR);
    saveState("ww_legs",legsScore);
    setCheckinDone(true);setTab("today");
  };

  const plan=useMemo(()=>buildPlan(overrides),[overrides]);
  const entry=plan[currentDay]||{workoutId:"REST"};
  const isBlockedDay=entry.workoutId==="HOLIDAY"||entry.workoutId==="SICK"||entry.workoutId==="FREE";
  const tsb=stravaData?stravaData.tsb:null;
  const {id:adjId,note:rdNote,adjusted,eff:effectiveReadiness,strMod}=isBlockedDay
    ?{id:entry.workoutId,note:null,adjusted:false,eff:readiness,strMod:null}
    :adjustForReadiness(entry.workoutId,readiness,restingHR,legsScore,tsb);
  const baseWorkout=WORKOUTS[adjId]||WORKOUTS.REST;
  const workout=shortenPct?shortenWorkout(baseWorkout,shortenPct):baseWorkout;
  const plannedWorkout=WORKOUTS[entry.workoutId]||WORKOUTS.REST;
  const weekNum=Math.floor(currentDay/7)+1;
  // Strength: check planned workout type (adjId never swaps away from strength now)
  const isStrengthDay=WORKOUTS[adjId]&&WORKOUTS[adjId].type==="STRENGTH";
  const strSession=isStrengthDay?getStrengthSession(weekNum):null;

  const effColor=effectiveReadiness>=80?"#16a34a":effectiveReadiness>=65?"#22c55e":effectiveReadiness>=50?"#ca8a04":effectiveReadiness>=35?"#ea580c":"#dc2626";
  const effLabel=effectiveReadiness>=80?"Peak — full session":effectiveReadiness>=65?"Good — slight reduction":effectiveReadiness>=50?"Moderate — stepped down":effectiveReadiness>=35?"Low — go easy":"Very low — rest today";

  const handleCalendarClick=useCallback((idx)=>{
    if(blockMode){
      if(blockStart===null){setBlockStart(idx);}
      else{
        const s=Math.min(blockStart,idx),e=Math.max(blockStart,idx);
        const next={...overrides};
        for(let d=s;d<=e;d++) next[d]=blockMode;
        setOverrides(next);setBlockStart(null);setBlockMode(null);
      }
    }else{setCurrentDay(idx);setTab("today");}
  },[blockMode,blockStart,overrides]);

  const clearOverride=(idx)=>{const n={...overrides};delete n[idx];setOverrides(n);};

  // Drag & drop: swap two days within the same week only
  const handleDrop=(toIdx)=>{
    if(dragFrom===null||dragFrom===toIdx)return;
    if(Math.floor(dragFrom/7)!==Math.floor(toIdx/7))return; // same week check
    const planSnap=buildPlan(overrides); // read base plan
    const fromId=planSnap[dragFrom]?.workoutId||"REST";
    const toId=planSnap[toIdx]?.workoutId||"REST";
    setOverrides(prev=>{
      const n={...prev};
      // Set each day to the other's workout; if it matches the un-overridden base, store it anyway so the swap is explicit
      n[dragFrom]=toId;
      n[toIdx]=fromId;
      return n;
    });
    setDragFrom(null);
  };

  // Styles
  const S={
    page:{minHeight:"100vh",background:"var(--bg-page)",color:"var(--text-primary)"},
    hdr:{background:"var(--hdr-bg)",padding:"16px 20px 14px",display:"flex",justifyContent:"space-between",alignItems:"center"},
    nav:{background:"var(--hdr-bg)",borderBottom:"1px solid var(--hdr-border)",display:"flex",overflowX:"auto"},
    navBtn:(a)=>({padding:"11px 16px",background:"none",border:"none",borderBottom:a?"2px solid #e2e8f0":"2px solid transparent",cursor:"pointer",fontSize:13,fontWeight:a?700:400,color:a?"#f8fafc":"#64748b",fontFamily:"inherit",whiteSpace:"nowrap",transition:"color .15s"}),
    body:{maxWidth:660,margin:"0 auto",padding:"20px 16px"},
    card:{background:"var(--bg-card)",border:"1px solid var(--border)",borderRadius:12,padding:20,marginBottom:16,boxShadow:"var(--shadow)"},
    lbl:{fontSize:12,color:"var(--text-muted)",marginBottom:6,display:"block"},
    h2:{fontSize:22,fontWeight:800,margin:"0 0 4px",color:"var(--text-primary)"},
    h3:{fontSize:16,fontWeight:700,margin:"0 0 10px",color:"var(--text-primary)"},
    b2:{fontSize:14,color:"var(--text-secondary)",lineHeight:1.7},
    divider:{border:"none",borderTop:"1px solid var(--divider)",margin:"16px 0"},
    btn:(c="var(--text-secondary)",bg="var(--bg-input)")=>({padding:"8px 14px",borderRadius:8,border:"1px solid var(--border)",background:bg,color:c,fontSize:13,fontWeight:600,cursor:"pointer",fontFamily:"inherit"}),
    btnP:{padding:"10px 20px",borderRadius:8,border:"none",background:"#0f172a",color:"#f8fafc",fontSize:13,fontWeight:700,cursor:"pointer",fontFamily:"inherit"},
    card12:{background:"var(--bg-card)",border:"1px solid var(--border)",borderRadius:12,padding:20,marginBottom:16,boxShadow:"var(--shadow)"},
  };

  if(!pinUnlocked) return <PinLock onUnlock={handlePinUnlock}/>;

  return(
    <div style={S.page}>
      {/* Header */}
      <div style={S.hdr}>
        <div>
          <div style={{fontSize:11,color:"#475569",marginBottom:2,letterSpacing:.3}}>WYKESWATTS · OFF-SEASON BASE · AUT/WIN 2026</div>
          <div style={{fontSize:19,fontWeight:800,color:"#f8fafc",letterSpacing:-.3}}>Adaptive Cycling Coach</div>
        </div>
        <div style={{textAlign:"right"}}>
          <div style={{fontSize:11,color:"#475569"}}>FTP / Target</div>
          <div style={{fontSize:17,fontWeight:800,color:"#f8fafc"}}>{ftp}w <span style={{color:"#22c55e",fontWeight:500}}>→ 280w</span></div>
        </div>
      </div>

      {/* Nav */}
      <div style={S.nav}>
        {[["checkin","Check-in"],["today","Today"],["plan","Plan"],["progress","Progress"],["zones","Zones"]].map(([v,l])=>(
          <button key={v} style={S.navBtn(tab===v)} onClick={()=>setTab(v)}>
            {l}{v==="checkin"&&!checkinDone?<span style={{marginLeft:5,width:7,height:7,borderRadius:4,background:"#ef4444",display:"inline-block",verticalAlign:"middle"}}/>:null}
          </button>
        ))}
      </div>

      <div style={S.body}>

        {/* ── CHECK-IN TAB ─────────────────────────────────────────────────── */}
        {tab==="checkin"&&(
          <div style={S.card12}>
            <h3 style={{...S.h3,marginBottom:4}}>Morning check-in</h3>
            <p style={{...S.b2,marginBottom:20}}>{checkinDone?"Today's check-in saved. Update any values if needed.":"Takes 30 seconds. Tells the system how hard to push today."}</p>

            {/* Sync button */}
            <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:20}}>
              <div style={{fontSize:12,color:"var(--text-faint)"}}>
                {syncing?"Syncing…":garminData?`Garmin: ${loadState("ww_garmin_date","–")} · Strava: ${loadState("ww_strava_sync_date","not connected")}`:"Tap Sync to fetch latest data"}
              </div>
              <button onClick={syncAll} disabled={syncing}
                style={{padding:"8px 18px",borderRadius:8,border:"none",background:syncing?"#e2e8f0":"#0f172a",color:syncing?"#94a3b8":"#f8fafc",fontSize:13,fontWeight:700,cursor:syncing?"not-allowed":"pointer",fontFamily:"inherit"}}>
                {syncing?"Syncing…":"⟳ Sync"}
              </button>
            </div>

            {/* ── GARMIN HEALTH ── */}
            <div style={{marginBottom:20,paddingBottom:20,borderBottom:"1px solid var(--border)"}}>
              <div style={{fontSize:13,fontWeight:700,color:"var(--text-secondary)",marginBottom:10}}>Garmin health data</div>
              {garminError&&<div style={{fontSize:12,color:"#ef4444",marginBottom:8}}>{garminError}</div>}
              {garminData&&!garminError?(
                <div style={{display:"grid",gridTemplateColumns:"repeat(3,1fr)",gap:6}}>
                  {[
                    {label:"Resting HR",value:garminData.restingHR?`${garminData.restingHR} bpm`:null},
                    {label:"HRV",value:garminData.hrv!=null?`${Math.round(garminData.hrv)} ms`:null,sub:garminData.hrvBaseline?`baseline ${Math.round(garminData.hrvBaseline)}ms`:null},
                    {label:"Body Battery",value:garminData.bodyBattery!=null?`${garminData.bodyBattery}%`:null},
                    {label:"Sleep score",value:garminData.sleepScore!=null?`${garminData.sleepScore}/100`:null},
                    {label:"Sleep",value:garminData.sleepDurationMin?`${Math.floor(garminData.sleepDurationMin/60)}h ${garminData.sleepDurationMin%60}m`:null},
                    {label:"Stress",value:garminData.stress!=null?`${garminData.stress}/100`:null},
                  ].map(({label,value,sub})=>(
                    <div key={label} style={{background:"var(--bg-input)",border:"1px solid var(--border)",borderRadius:8,padding:"6px 8px",textAlign:"center"}}>
                      <div style={{fontSize:9,color:"var(--text-faint)",marginBottom:2}}>{label}</div>
                      <div style={{fontSize:13,fontWeight:700,color:value?"var(--text-primary)":"var(--text-faint)"}}>{value||"–"}</div>
                      {sub&&<div style={{fontSize:8,color:"var(--text-faint)",marginTop:1}}>{sub}</div>}
                    </div>
                  ))}
                </div>
              ):(
                !garminLoading&&<div style={{fontSize:12,color:"var(--text-faint)"}}>No Garmin data yet — tap Sync.</div>
              )}
            </div>

            {/* ── TRAINING READINESS (from Garmin) ── */}
            <div style={{marginBottom:20,paddingBottom:20,borderBottom:"1px solid var(--border)"}}>
              {(()=>{
                const rdColor=readiness>=80?"#16a34a":readiness>=65?"#22c55e":readiness>=50?"#ca8a04":readiness>=35?"#ea580c":"#dc2626";
                return(
                  <>
                    <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:8}}>
                      <span style={{fontSize:13,fontWeight:600,color:"var(--text-secondary)"}}>Training Readiness</span>
                      <span style={{fontSize:24,fontWeight:800,color:rdColor}}>{readiness}</span>
                    </div>
                    <input type="range" min={0} max={100} value={readiness} onChange={e=>setReadiness(Number(e.target.value))} style={{accentColor:rdColor,width:"100%"}}/>
                    <div style={{fontSize:11,color:"var(--text-faint)",marginTop:4}}>From your Garmin Connect app</div>
                  </>
                );
              })()}
            </div>

            {/* ── STRAVA ── */}
            <div style={{marginBottom:20,paddingBottom:20,borderBottom:"1px solid var(--border)"}}>
              <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:12}}>
                <div style={{fontSize:13,fontWeight:700,color:"var(--text-secondary)"}}>Strava</div>
                {!stravaTokens&&(
                  <button onClick={handleStravaConnect}
                    style={{padding:"6px 14px",borderRadius:8,border:"none",background:"#fc4c02",color:"#fff",fontSize:12,fontWeight:700,cursor:"pointer",fontFamily:"inherit"}}>
                    Connect Strava
                  </button>
                )}
              </div>

              {/* Yesterday's ride */}
              {stravaTokens&&(
                <div style={{marginBottom:16}}>
                  <div style={{fontSize:11,fontWeight:600,color:"var(--text-faint)",textTransform:"uppercase",letterSpacing:.5,marginBottom:8}}>Yesterday's ride</div>
                  <YesterdayAnalysis data={yesterdayData} plannedId={entry.workoutId} ftp={ftp} loading={yesterdayLoading}/>
                </div>
              )}

              {/* Fitness metrics */}
              {stravaError&&<div style={{padding:"8px 12px",background:"#fef2f2",border:"1px solid #fecaca",borderRadius:8,fontSize:13,color:"#dc2626",marginBottom:10}}>{stravaError}</div>}
              {stravaData&&(
                <>
                  <div style={{fontSize:11,fontWeight:600,color:"var(--text-faint)",textTransform:"uppercase",letterSpacing:.5,marginBottom:8}}>Fitness metrics</div>
                  <div style={{display:"grid",gridTemplateColumns:"repeat(3,1fr)",gap:8,marginBottom:8}}>
                    {[["CTL",stravaData.ctl,"Fitness","#16a34a"],["ATL",stravaData.atl,"Fatigue","#ea580c"],["TSB",stravaData.tsb,"Form",stravaData.tsb>=0?"#16a34a":"#dc2626"]].map(([key,val,label,color])=>(
                      <div key={key} style={{background:"var(--bg-input)",border:"1px solid var(--border)",borderRadius:8,padding:"10px 12px",textAlign:"center"}}>
                        <div style={{fontSize:11,color:"var(--text-faint)"}}>{label}</div>
                        <div style={{fontSize:24,fontWeight:800,color}}>{val}</div>
                        <div style={{fontSize:11,fontWeight:700,color:"var(--text-muted)"}}>{key}</div>
                      </div>
                    ))}
                  </div>
                  <div style={{padding:"8px 12px",background:"var(--bg-input)",border:"1px solid var(--border)",borderRadius:8,fontSize:13,color:"var(--text-secondary)"}}>{stravaData.form} · {stravaData.ridesLast7} rides last 7 days · {stravaData.weeklyTSS} TSS</div>
                </>
              )}
            </div>

            {/* ── LEG FEEL + SAVE ── */}
            <MorningCheckin readiness={readiness} setReadiness={setReadiness} restingHR={restingHR} setRestingHR={setRestingHR} legsScore={legsScore} setLegsScore={setLegsScore} onSave={handleCheckinSave}/>
          </div>
        )}

        {/* ── TODAY TAB ───────────────────────────────────────────────────── */}
        {tab==="today"&&(
          <>
            {/* PWA install */}
            {showInstall&&!isStandalone&&(
              <div style={{...S.card12,borderColor:"#8b5cf640"}}>
                <div style={{display:"flex",justifyContent:"space-between",alignItems:"flex-start"}}>
                  <div style={{flex:1}}>
                    <div style={{fontSize:14,fontWeight:700,color:"var(--text-primary)",marginBottom:4}}>📱 Add to Home Screen</div>
                    <div style={{fontSize:13,color:"var(--text-secondary)",lineHeight:1.6,marginBottom:8}}>Install WykesWatts as an app for instant morning access.</div>
                    <div style={{fontSize:13,color:"var(--text-muted)",lineHeight:1.8}}>
                      <strong>iPhone/iPad:</strong> Tap Share ↑ → Add to Home Screen<br/>
                      <strong>Mac/Safari:</strong> Click Share ↑ → Add to Dock
                    </div>
                  </div>
                  <button onClick={()=>{setShowInstall(false);saveState("ww_install_dismissed",true);}}
                    style={{background:"none",border:"none",fontSize:20,cursor:"pointer",color:"var(--text-faint)",padding:"0 0 0 12px",lineHeight:1}}>×</button>
                </div>
              </div>
            )}

            {/* Check-in prompt */}
            {!checkinDone&&(
              <div style={{...S.card12,borderColor:"#f97316",background:"var(--bg-card)",cursor:"pointer"}} onClick={()=>setTab("checkin")}>
                <div style={{display:"flex",justifyContent:"space-between",alignItems:"center"}}>
                  <div>
                    <div style={{fontSize:14,fontWeight:700,color:"var(--text-primary)"}}>Morning check-in not done yet</div>
                    <div style={{fontSize:13,color:"var(--text-muted)",marginTop:2}}>Tap to complete — 30 seconds</div>
                  </div>
                  <span style={{fontSize:20,color:"var(--text-faint)"}}>→</span>
                </div>
              </div>
            )}

            {/* Day navigation */}
            <div style={S.card12}>
              <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:12}}>
                <div>
                  <div style={{fontSize:13,color:"var(--text-muted)"}}>{fmtDate(getPlanDate(currentDay))} · Week {weekNum}</div>
                  <div style={{fontSize:15,fontWeight:700,marginTop:2,color:"var(--text-primary)"}}>
                    Off-season base block
                  </div>
                </div>
                <div style={{display:"flex",gap:6,flexWrap:"wrap",justifyContent:"flex-end"}}>
                  {currentDay!==todayIdx&&<button style={S.btn("#16a34a","#f0fdf4")} onClick={()=>setCurrentDay(todayIdx)}>Today</button>}
                  <button style={S.btn()} onClick={()=>setCurrentDay(Math.max(0,currentDay-1))}>←</button>
                  <button style={S.btn()} onClick={()=>setCurrentDay(Math.min(83,currentDay+1))}>→</button>
                </div>
              </div>
              <input type="range" min={0} max={83} value={currentDay} onChange={e=>setCurrentDay(Number(e.target.value))} style={{accentColor:"#0f172a"}}/>
              <div style={{display:"flex",justifyContent:"space-between",fontSize:11,color:"var(--text-faint)",marginTop:4}}>
                <span>Wk 1 · {fmtDate(getPlanDate(0))}</span>
                <span>Wk 12 · {fmtDate(getPlanDate(83))}</span>
              </div>
            </div>

            {/* Effective readiness */}
            {!isBlockedDay&&checkinDone&&(
              <div style={{...S.card12,borderColor:effColor+"40",padding:"14px 20px"}}>
                <div style={{display:"flex",justifyContent:"space-between",alignItems:"center"}}>
                  <div>
                    <div style={{fontSize:12,color:"var(--text-muted)"}}>Effective readiness</div>
                    <div style={{fontSize:14,fontWeight:700,color:effColor,marginTop:2}}>{effLabel}</div>
                  </div>
                  <div style={{textAlign:"right"}}>
                    <div style={{fontSize:36,fontWeight:900,color:effColor,lineHeight:1}}>{effectiveReadiness}</div>
                    <div style={{fontSize:11,color:"var(--text-faint)",marginTop:4}}>TR {readiness} · HR {restingHR}bpm · Legs {legsScore}/5{tsb!==null?` · TSB ${tsb}`:""}</div>
                  </div>
                </div>
                {adjusted&&rdNote&&(
                  <div style={{marginTop:10,padding:"8px 12px",background:effColor+"12",border:`1px solid ${effColor}30`,borderRadius:8,fontSize:13,color:effColor}}>
                    {rdNote}
                  </div>
                )}
                {adjusted&&(
                  <div style={{marginTop:6,fontSize:12,color:"var(--text-faint)"}}>Planned: {plannedWorkout.name}</div>
                )}
              </div>
            )}

            {/* Session display */}
            {adjId==="REST"&&!isBlockedDay?(
              <div style={{...S.card12,borderColor:"#cbd5e1"}}>
                <Tag type="REST"/>
                <div style={{fontSize:22,fontWeight:800,marginTop:10,color:"var(--text-primary)"}}>Rest today 🛌</div>
                <p style={{...S.b2,marginTop:6}}>{rdNote||"Complete rest. Sleep, eat well, stay off the bike. Recovery is where adaptation happens."}</p>
                {adjusted&&<div style={{marginTop:10,fontSize:12,color:"var(--text-faint)"}}>Planned: {plannedWorkout.name}</div>}
              </div>
            ):adjId==="RECOVERY"&&entry.workoutId!=="RECOVERY"?(
              <div style={{...S.card12,borderColor:"#94a3b8"}}>
                <Tag type="RECOVERY"/>
                <div style={{fontSize:22,fontWeight:800,marginTop:10,color:"var(--text-primary)"}}>Easy spin only 🚴</div>
                <p style={{...S.b2,marginTop:6}}>{rdNote||"Readiness is very low. 20–30 min easy spin at conversational pace. No ERG mode, no targets."}</p>
                {adjusted&&<div style={{marginTop:10,fontSize:12,color:"var(--text-faint)"}}>Planned: {plannedWorkout.name}</div>}
              </div>
            ):entry.workoutId==="FREE"?(
              <div style={{...S.card12,borderColor:"#6366f140"}}>
                <Tag type="FREE"/>
                <div style={{fontSize:22,fontWeight:800,marginTop:10,color:"var(--text-primary)"}}>Optional outdoor ride 🚵</div>
                <p style={{...S.b2,marginTop:6}}>No structure — if the weather is good, get outside. Any pace, any route. If not, rest or an easy spin works too.</p>
              </div>
            ):entry.workoutId==="HOLIDAY"||entry.workoutId==="SICK"?(
              <div style={{...S.card12,borderColor:entry.workoutId==="HOLIDAY"?"#0ea5e940":"#be185d40"}}>
                <div style={{display:"flex",justifyContent:"space-between",alignItems:"center"}}>
                  <div>
                    <Tag type={entry.workoutId}/>
                    <div style={{fontSize:22,fontWeight:800,marginTop:10,color:"var(--text-primary)"}}>{entry.workoutId==="HOLIDAY"?"On holiday":"Sick day"}</div>
                    <p style={{...S.b2,marginTop:6}}>{entry.workoutId==="HOLIDAY"?"Enjoy it. The plan will be here when you're back.":"Rest up. The plan resumes once you've recovered."}</p>
                  </div>
                  <button style={S.btn("#dc2626","#fff1f2")} onClick={()=>clearOverride(currentDay)}>Remove</button>
                </div>
              </div>
            ):isStrengthDay&&strSession?(
              <StrengthCard session={strSession} weekNum={weekNum} shortenPct={strShortenPct} setShortenPct={setStrShortenPct} strMod={strMod}/>
            ):(
              <>
                <div style={{...S.card12,borderColor:(SESSION_TYPES[workout.type]?.color||"#e2e8f0")+"30"}}>
                  <div style={{display:"flex",justifyContent:"space-between",alignItems:"flex-start",marginBottom:12}}>
                    <div>
                      <Tag type={workout.type}/>
                      <h2 style={{...S.h2,marginTop:8}}>{workout.name}</h2>
                    </div>
                    {workout.tss>0&&(
                      <div style={{textAlign:"right",background:"var(--bg-input)",border:"1px solid var(--border)",borderRadius:8,padding:"8px 14px",flexShrink:0}}>
                        <div style={{fontSize:11,color:"var(--text-faint)"}}>Est. TSS</div>
                        <div style={{fontSize:22,fontWeight:800}}>{workout.tss}</div>
                      </div>
                    )}
                  </div>
                  <p style={S.b2}>{workout.description}</p>

                  {workout.intervals.length>0&&(
                    <>
                      <PowerBar intervals={workout.intervals} ftp={ftp}/>
                      <hr style={S.divider}/>
                      <div>
                        {workout.intervals.map((iv,i)=>{
                          const z=getZone(midPct(iv));
                          const isRamp=!!iv.ramp;
                          const swatch=isRamp?`linear-gradient(to bottom,${getZone(iv.ramp[0]).color},${getZone(iv.ramp[1]).color})`:z.color;
                          return(
                            <div key={i} style={{display:"flex",justifyContent:"space-between",alignItems:"center",padding:"9px 0",borderBottom:i<workout.intervals.length-1?"1px solid var(--divider)":"none"}}>
                              <div style={{display:"flex",alignItems:"center",gap:10}}>
                                <div style={{width:3,height:18,borderRadius:2,background:swatch,flexShrink:0}}/>
                                <span style={{fontSize:14,color:"var(--text-secondary)"}}>{iv.label}</span>
                                {isRamp&&<span style={{fontSize:10,color:"var(--text-faint)",background:"var(--bg-input)",padding:"1px 6px",borderRadius:10}}>ramp</span>}
                              </div>
                              <div style={{display:"flex",gap:16,alignItems:"center"}}>
                                <span style={{fontSize:14,fontWeight:700,color:z.color}}>{ivLabel(iv,ftp)}</span>
                                <span style={{fontSize:13,color:"var(--text-faint)",width:36,textAlign:"right"}}>{iv.dur}m</span>
                              </div>
                            </div>
                          );
                        })}
                      </div>
                      <hr style={S.divider}/>
                      {/* Shorten workout */}
                      <div style={{marginBottom:14}}>
                        <div style={{fontSize:13,fontWeight:600,color:"var(--text-secondary)",marginBottom:8}}>Short on time?</div>
                        <div style={{display:"flex",gap:6}}>
                          {[null,0.75,0.5,0.25].map(p=>{
                            const dur=p===null?baseWorkout.duration:shortenWorkout(baseWorkout,p).duration;
                            return(
                              <button key={p} onClick={()=>setShortenPct(p)}
                                style={{flex:1,padding:"9px 4px",borderRadius:8,border:shortenPct===p?"2px solid #0f172a":"1px solid var(--border)",background:shortenPct===p?"#0f172a":"var(--bg-input)",color:shortenPct===p?"#f8fafc":"var(--text-secondary)",fontSize:12,fontWeight:700,cursor:"pointer",fontFamily:"inherit",lineHeight:1.4,transition:"all .15s"}}>
                                <div>{p===null?"Full":Math.round(p*100)+"%"}</div>
                                <div style={{fontSize:10,fontWeight:400,opacity:.8}}>{dur} min</div>
                              </button>
                            );
                          })}
                        </div>
                        {shortenPct&&(
                          <div style={{marginTop:8,padding:"8px 12px",background:"#fff7ed",border:"1px solid #fed7aa",borderRadius:8,fontSize:12,color:"#9a3412"}}>
                            ⚠ TSS deficit: {workout.tssDeficit} pts — consider an extra Zone 2 session to compensate.
                          </div>
                        )}
                      </div>
                      <div style={{display:"flex",justifyContent:"space-between",alignItems:"center"}}>
                        <div style={{fontSize:14,fontWeight:700,color:"var(--text-primary)"}}>Export to Zwift</div>
                        <button style={S.btnP} onClick={()=>downloadZWO(adjId,ftp,workout.name,weekNum,currentDay,shortenPct?workout:null)}>
                          Download .zwo
                        </button>
                      </div>
                    </>
                  )}
                </div>

                <div style={S.card12}>
                  <span style={S.lbl}>FTP — update after each test</span>
                  <div style={{display:"flex",justifyContent:"space-between",marginBottom:8}}>
                    <span style={{fontSize:22,fontWeight:800}}>{ftp}w</span>
                    <span style={{fontSize:14,color:"var(--text-muted)",alignSelf:"center"}}>{(ftp/ATHLETE.weight).toFixed(2)} w/kg</span>
                  </div>
                  <input type="range" min={180} max={320} value={ftp} onChange={e=>setFtp(Number(e.target.value))} style={{accentColor:"#0f172a"}}/>
                </div>
              </>
            )}
          </>
        )}

        {/* ── PLAN TAB ─────────────────────────────────────────────────────── */}
        {tab==="plan"&&(
          <>
            {/* Plan summary */}
            <div style={S.card12}>
              <h3 style={S.h3}>Off-season base block</h3>
              <p style={{fontSize:13,color:"var(--text-muted)",lineHeight:1.7,marginBottom:12}}>
                12 weeks of Zone 2 cycling + progressive strength work. No VO2 or threshold — this block builds aerobic engine and cycling-specific strength. FTP test in week 12.
              </p>
              <div style={{display:"grid",gridTemplateColumns:"repeat(2,1fr)",gap:8}}>
                {[
                  {label:"Mon/Wed/Fri",value:"Zone 2 cycling",icon:"🚴",color:"#22c55e"},
                  {label:"Tue/Thu",value:"Strength",icon:"🏋️",color:"#8b5cf6"},
                  {label:"Sat",value:"Optional outdoor",icon:"🚵",color:"#6366f1"},
                  {label:"Sun",value:"Rest",icon:"🛌",color:"#94a3b8"},
                ].map(({label,value,icon,color})=>(
                  <div key={label} style={{background:"var(--bg-input)",border:"1px solid var(--border)",borderRadius:8,padding:"10px 12px"}}>
                    <div style={{fontSize:11,color:"var(--text-faint)",marginBottom:2}}>{label}</div>
                    <div style={{fontSize:13,fontWeight:700,color}}>{icon} {value}</div>
                  </div>
                ))}
              </div>
            </div>

            {/* Mark days off */}
            <div style={S.card12}>
              <h3 style={S.h3}>Mark days off</h3>
              <p style={{fontSize:13,color:"var(--text-muted)",marginBottom:12}}>
                {blockMode?(blockStart===null?`Click the first day of your ${blockMode==="HOLIDAY"?"holiday":"sick period"}.`:`Now click the last day.`):"Select type then tap start and end days on the calendar."}
              </p>
              <div style={{display:"flex",gap:8}}>
                <button style={{...S.btn(blockMode==="HOLIDAY"?"#0369a1":"var(--text-secondary)",blockMode==="HOLIDAY"?"#e0f2fe":"var(--bg-input)"),borderColor:blockMode==="HOLIDAY"?"#7dd3fc":"var(--border)"}} onClick={()=>{setBlockMode(blockMode==="HOLIDAY"?null:"HOLIDAY");setBlockStart(null);}}>✈ Holiday</button>
                <button style={{...S.btn(blockMode==="SICK"?"#9d174d":"var(--text-secondary)",blockMode==="SICK"?"#fce7f3":"var(--bg-input)"),borderColor:blockMode==="SICK"?"#f9a8d4":"var(--border)"}} onClick={()=>{setBlockMode(blockMode==="SICK"?null:"SICK");setBlockStart(null);}}>🤒 Sick</button>
                {blockMode&&<button style={S.btn()} onClick={()=>{setBlockMode(null);setBlockStart(null);}}>Cancel</button>}
              </div>
            </div>

            {/* Calendar grid */}
            {Array.from({length:12},(_,wk)=>{
              const isRec=wk===3||wk===7;
              const isTest=wk===11;
              return(
                <div key={wk} style={{marginBottom:12}}>
                  <div style={{display:"flex",alignItems:"center",gap:8,marginBottom:6}}>
                    <span style={{fontSize:13,fontWeight:700,color:"var(--text-secondary)"}}>Week {wk+1}</span>
                    {isRec&&<span style={{fontSize:11,color:"#64748b",background:"var(--bg-input)",padding:"1px 8px",borderRadius:20,border:"1px solid var(--border)"}}>recovery</span>}
                    {isTest&&<span style={{fontSize:11,color:"#7c3aed",background:"#faf5ff",padding:"1px 8px",borderRadius:20,border:"1px solid #8b5cf640"}}>FTP test</span>}
                  </div>
                  <div style={{display:"grid",gridTemplateColumns:"repeat(7,1fr)",gap:3}}>
                    {Array.from({length:7},(_,d)=>{
                      const idx=wk*7+d;
                      const e=plan[idx]||{workoutId:"REST"};
                      const wId=e.workoutId;
                      const isToday=idx===todayIdx;
                      const isPast=idx<todayIdx;
                      const isSel=idx===currentDay&&!isToday;
                      const isBStart=blockStart===idx;
                      const w=WORKOUTS[wId];
                      const isStr=STRENGTH_SESSIONS[wId];
                      const type=wId==="HOLIDAY"?"HOLIDAY":wId==="SICK"?"SICK":isStr?"STRENGTH":w?.type||"REST";
                      const st=SESSION_TYPES[type]||SESSION_TYPES.REST;
                      const lbl=wId==="REST"?"–":wId==="RECOVERY"?"EZ":wId==="FREE"?"🚴":wId==="HOLIDAY"?"✈":wId==="SICK"?"🤒":STRENGTH_SESSIONS[wId]?"💪":wId.includes("90")||wId.includes("PYRAMID")?"Z2+":"Z2";
                      const pd=getPlanDate(idx);
                      const isDragTarget=dragFrom!==null&&dragFrom!==idx&&Math.floor(dragFrom/7)===Math.floor(idx/7);
                      const isDragging=dragFrom===idx;
                      return(
                        <button key={d}
                          draggable={!blockMode}
                          onDragStart={()=>setDragFrom(idx)}
                          onDragEnd={()=>setDragFrom(null)}
                          onDragOver={e=>{if(isDragTarget)e.preventDefault();}}
                          onDrop={e=>{e.preventDefault();handleDrop(idx);}}
                          onClick={()=>handleCalendarClick(idx)}
                          style={{background:isDragging?"#1e40af":isToday?"#0f172a":isBStart?"#dbeafe":isDragTarget?"#dbeafe":st.bg,border:isDragging?"2px solid #3b82f6":isToday?"2px solid #0f172a":isSel?"2px solid #64748b":isBStart?"2px solid #3b82f6":isDragTarget?"2px dashed #3b82f6":`1px solid ${st.color}20`,borderRadius:8,padding:"5px 2px",cursor:blockMode?"crosshair":"grab",textAlign:"center",opacity:isPast&&!isToday?.5:1,transition:"all .15s"}}>
                          <div style={{fontSize:8,color:isToday||isDragging?"#64748b":"var(--text-faint)",marginBottom:1}}>{DAY_NAMES[d]}</div>
                          <div style={{fontSize:10,fontWeight:800,color:isDragging?"#bfdbfe":isToday?"#f8fafc":isPast?"var(--text-faint)":st.color}}>{lbl}</div>
                          <div style={{fontSize:7,color:isToday||isDragging?"#475569":"var(--text-faint)",marginTop:1}}>{pd.getDate()}</div>
                        </button>
                      );
                    })}
                  </div>
                </div>
              );
            })}

            {/* Legend */}
            <div style={S.card12}>
              <div style={{display:"flex",flexWrap:"wrap",gap:6}}>
                {Object.entries(SESSION_TYPES).map(([k,v])=>(
                  <span key={k} style={{fontSize:11,color:v.color,background:v.bg,border:`1px solid ${v.color}25`,padding:"3px 10px",borderRadius:20}}>{v.label}</span>
                ))}
              </div>
              <div style={{marginTop:8,fontSize:11,color:"var(--text-faint)"}}>Dark = today · Faded = past · 💪 = Strength · Z2+ = 90 min</div>
              <div style={{marginTop:4,fontSize:11,color:"var(--text-faint)"}}>↔ Drag days within a week to swap workouts</div>
            </div>
          </>
        )}

        {/* ── PROGRESS TAB ─────────────────────────────────────────────────── */}
        {tab==="progress"&&(
          <ProgressTab ftp={ftp} stravaData={stravaData} todayIdx={todayIdx}/>
        )}

        {/* ── ZONES TAB ────────────────────────────────────────────────────── */}
        {tab==="zones"&&(
          <>
            <div style={S.card12}>
              <span style={S.lbl}>FTP</span>
              <div style={{display:"flex",justifyContent:"space-between",marginBottom:8}}>
                <span style={{fontSize:30,fontWeight:900}}>{ftp}w</span>
                <span style={{fontSize:16,color:"var(--text-muted)",alignSelf:"flex-end"}}>{(ftp/ATHLETE.weight).toFixed(2)} w/kg</span>
              </div>
              <input type="range" min={180} max={320} value={ftp} onChange={e=>setFtp(Number(e.target.value))} style={{accentColor:"#0f172a"}}/>
            </div>
            {ZONES.map(z=>(
              <div key={z.id} style={{...S.card12,display:"flex",alignItems:"center",gap:16,padding:"14px 20px"}}>
                <div style={{width:4,height:56,borderRadius:2,background:z.color,flexShrink:0}}/>
                <div style={{flex:1}}>
                  <div style={{fontSize:11,fontWeight:700,color:z.color,marginBottom:2,letterSpacing:.5}}>ZONE {z.id}</div>
                  <div style={{fontSize:17,fontWeight:700,color:"var(--text-primary)"}}>{z.name}</div>
                  <div style={{fontSize:12,color:"var(--text-faint)",marginTop:2}}>{z.pct[0]}–{z.pct[1]}% FTP</div>
                </div>
                <div style={{fontSize:22,fontWeight:800,color:z.color}}>{calcW(z.pct[0],ftp)}–{calcW(z.pct[1],ftp)}w</div>
              </div>
            ))}
            <div style={S.card12}>
              <h3 style={S.h3}>Your numbers</h3>
              {[["Current FTP",`${ftp}w`],["W/kg",(ftp/ATHLETE.weight).toFixed(2)],["Target FTP","280w"],["Target W/kg",(280/ATHLETE.weight).toFixed(2)],["Baseline RHR",`${ATHLETE.restingHR} bpm`],["Weight",`${ATHLETE.weight} kg`]].map(([k,v])=>(
                <div key={k} style={{display:"flex",justifyContent:"space-between",padding:"11px 0",borderBottom:"1px solid var(--divider)",fontSize:14}}>
                  <span style={{color:"var(--text-muted)"}}>{k}</span>
                  <span style={{fontWeight:700}}>{v}</span>
                </div>
              ))}
            </div>
          </>
        )}
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>
<script>
if('serviceWorker' in navigator){
  window.addEventListener('load',()=>{
    navigator.serviceWorker.register('/sw.js').catch(()=>{});
  });
}
</script>
</body>
</html>
